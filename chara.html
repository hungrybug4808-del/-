<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>魔王軍略 キャラ図鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <nav class="picker" id="picker" aria-label="キャラクターを選ぶ"></nav>
  <header>
    <h1 id="name">…</h1>
    <div class="tags" id="tags"></div>
  </header>
  <div class="layout">
    <div class="stage" id="stage">
      <canvas id="c" aria-label="キャラクターの3Dモデル"></canvas>
      <div class="label" id="label"></div>
      <div class="say" id="say" hidden></div>
      <div class="hint">ドラッグで回転／ホイール・ピンチで拡大</div>
    </div>
    <aside class="panel">
      <h2>モーション</h2>
      <div class="moves" id="moves"></div>
      <p class="memo" id="memo"></p>
    </aside>
  </div>
</div>
<script type="module" src="/src/viewer/main.ts"></script>
</body>
</html>
