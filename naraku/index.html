<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>奈落 — 落下音ゲー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#f3cf7a;--gold2:#ffe9b0;--panel:rgba(10,8,14,.8);--line:rgba(243,207,122,.38);--red:#ff6a3a;--txt:#efe6d2;--dim:#a39880}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050407;color:var(--txt);font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;overflow:hidden;user-select:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
#hud .top{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:minmax(170px,1fr) minmax(240px,2.2fr) minmax(150px,1fr);gap:26px;align-items:center;padding:14px 24px 26px;background:linear-gradient(rgba(4,3,7,.8),rgba(4,3,7,0))}
.layerNo{font-size:12px;color:var(--gold);letter-spacing:.35em}
.layerName{font-size:22px;font-weight:700;letter-spacing:.14em;text-shadow:0 0 12px #000}
.prog{position:relative;height:42px}
#progLabel{position:absolute;left:0;right:0;top:0;text-align:center;font-size:12px;letter-spacing:.4em;color:var(--gold2)}
#progSegs{position:absolute;left:0;right:0;top:22px;height:8px;display:flex;gap:2px}
#progSegs div{height:100%;border-radius:1px;opacity:.45}
#progSegs div.on{opacity:1;box-shadow:0 0 8px currentColor}
#progHead{position:absolute;top:17px;width:2px;height:18px;background:#fff;box-shadow:0 0 8px #fff;left:0}
.depth{text-align:right;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;text-shadow:0 0 12px #000}
.depth .lbl{display:block;font-size:11px;color:var(--gold);letter-spacing:.35em;font-weight:500}
.depth small{font-size:14px;margin-left:4px;color:var(--dim)}
#mubou{position:absolute;left:24px;top:86px;padding:5px 16px 5px 20px;border:1px solid var(--gold);color:var(--gold2);font-weight:800;letter-spacing:.5em;font-size:15px;background:rgba(24,18,6,.55);box-shadow:inset 0 0 14px rgba(243,207,122,.3),0 0 12px rgba(243,207,122,.25)}
#mubou.hit{border-color:var(--red);color:#ffb39a;box-shadow:0 0 22px rgba(255,90,40,.7)}
#legend{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;gap:28px;align-items:center;font-size:14px;background:var(--panel);padding:10px 22px;border:1px solid var(--line);transition:opacity 1s;white-space:nowrap}
#legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.keys{letter-spacing:.2em;color:var(--gold2)}
#count{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);font-size:64px;font-weight:800;color:var(--gold2);text-shadow:0 0 24px rgba(243,207,122,.8);opacity:0;transition:opacity .15s}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:3}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center;padding:24px}
.veil{background:radial-gradient(ellipse at center,rgba(5,4,8,.25),rgba(5,4,8,.85))}
.panel{background:var(--panel);border:1px solid var(--line);padding:30px 42px;min-width:min(420px,92vw);box-shadow:0 0 40px rgba(0,0,0,.6)}
.btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.btn{background:rgba(243,207,122,.08);border:1px solid var(--gold);padding:10px 26px;letter-spacing:.25em;font-size:16px;font-weight:700;color:var(--gold2);transition:background .15s,box-shadow .15s}
.btn:hover,.btn:focus-visible{background:rgba(243,207,122,.2);box-shadow:0 0 16px rgba(243,207,122,.4);outline:none}
.btn.sub{border-color:var(--line);color:var(--txt);font-weight:500}
.btn small{font-size:11px;opacity:.7;margin-left:8px;letter-spacing:.05em}
#title h1{font-size:clamp(72px,14vw,150px);font-weight:800;letter-spacing:.3em;margin-right:-.3em;color:var(--gold2);text-shadow:0 0 30px rgba(243,207,122,.55),0 0 80px rgba(120,180,120,.35)}
#title .sub{letter-spacing:.6em;color:var(--dim);font-size:15px;margin-top:-6px}
#title .press{margin-top:40px;letter-spacing:.4em;animation:blink 2.2s ease-in-out infinite}
#title .how{margin-top:14px;font-size:13px;color:var(--dim);line-height:2}
@keyframes blink{50%{opacity:.35}}
h2{font-size:34px;letter-spacing:.3em;font-weight:800}
.big{font-size:44px;font-weight:800;letter-spacing:.08em;font-variant-numeric:tabular-nums;color:var(--gold2)}
.note{color:var(--dim);font-size:14px;line-height:1.9}
#over h2{color:#ff9a78;text-shadow:0 0 20px rgba(255,90,40,.6)}
#clear h2{color:var(--gold2);text-shadow:0 0 24px rgba(243,207,122,.7)}

/* ---------- map ---------- */
#map{flex-direction:row;gap:36px;align-items:center}
#mapSvg{height:min(92vh,760px);width:auto;filter:drop-shadow(0 0 20px rgba(0,0,0,.8))}
#mapSvg .band{cursor:pointer}
#mapSvg .band.locked{cursor:not-allowed}
#mapInfo{width:min(380px,40vw);text-align:left}
#mapInfo .kan{color:var(--gold);letter-spacing:.4em;font-size:13px}
#mapInfo h3{font-size:30px;letter-spacing:.15em;margin:4px 0 2px}
#mapInfo .range{font-size:18px;color:var(--gold2);font-variant-numeric:tabular-nums}
#mapInfo dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:18px 0;font-size:14px}
#mapInfo dt{color:var(--dim)}
#mapInfo .status{margin:4px 0 16px;font-weight:700;letter-spacing:.2em}
#mapInfo .btns{justify-content:flex-start}
.maphint{position:fixed;bottom:14px;left:0;right:0;text-align:center;font-size:12px;color:var(--dim);letter-spacing:.2em}

/* ---------- ending ---------- */
#ending{color:#3a2c14}
#ending .line{font-size:clamp(22px,3vw,34px);letter-spacing:.4em;font-weight:700;opacity:0;transition:opacity 2.4s;text-shadow:0 0 18px rgba(255,255,240,.9)}
#ending .line.show{opacity:1}
#ending .line.huge{font-size:clamp(56px,9vw,110px);letter-spacing:.35em}
#ending .btns{opacity:0;transition:opacity 2s}
#ending .btns.show{opacity:1}
#ending .btn{color:#3a2c14;border-color:#8a6a2a;background:rgba(255,250,235,.5)}
@media (max-width:760px){#map{flex-direction:column;gap:10px}#mapSvg{height:56vh}#mapInfo{width:92vw}#hud .top{grid-template-columns:1fr 1fr;gap:8px}.prog{grid-column:1/3;order:3}}
</style>

<body>
<canvas id="view"></canvas>

<div id="hud" class="hidden">
  <div class="top">
    <div><div class="layerNo" id="hudNo">深界一層</div><div class="layerName" id="hudName">縁の苔穴</div></div>
    <div class="prog"><div id="progLabel">静か</div><div id="progSegs"></div><div id="progHead"></div></div>
    <div class="depth"><span class="lbl">深度</span><span id="hudDepth">0</span><small>m</small></div>
  </div>
  <div id="mubou">無傷</div>
  <div id="count"></div>
  <div id="legend">
    <span class="keys">↑ → ↓ ←</span>
    <span><i style="background:#ffc840;box-shadow:0 0 8px #ffc840"></i>金の目 ＝ 斬る</span>
    <span><i style="background:#ff6a2a;box-shadow:0 0 8px #ff6a2a"></i>赤橙のふち ＝ よける</span>
    <span style="color:var(--dim)">リングに重なる瞬間に、来た方向のキー</span>
  </div>
</div>

<section id="title" class="screen veil">
  <h1>奈落</h1>
  <div class="sub">落 下 音 ゲ ー</div>
  <div class="press">クリック ／ キーを押して はじめる</div>
  <div class="how">穴の奥から、拍に合わせて敵と障害物がやってくる。<br>リングに重なる瞬間（±0.1秒）に、来た方向の矢印キー。<br>一度でも外せば、その層の最初から。</div>
</section>

<section id="map" class="screen veil hidden">
  <svg id="mapSvg" viewBox="0 0 330 760" aria-label="階層マップ"></svg>
  <div id="mapInfo" class="panel"></div>
  <div class="maphint">↑↓ 層をえらぶ　Enter 潜る　Esc タイトル</div>
</section>

<section id="over" class="screen veil hidden">
  <div class="panel">
    <h2>ゲームオーバー</h2>
    <p class="note" id="overWhy" style="margin-top:10px"></p>
    <div class="big" id="overDepth" style="margin:16px 0 4px">0 m</div>
    <p class="note" id="overBest"></p>
    <div class="btns" style="margin-top:22px">
      <button class="btn" id="btnRetry">すぐ再挑戦<small>Enter</small></button>
      <button class="btn sub" id="btnOverMap">マップへ戻る<small>Esc</small></button>
    </div>
  </div>
</section>

<section id="clear" class="screen veil hidden">
  <div class="panel">
    <div class="note" id="clearNo" style="letter-spacing:.4em"></div>
    <h2 id="clearTitle">踏破</h2>
    <div class="big" id="clearDepth" style="margin:16px 0 4px">1,000 m</div>
    <p class="note" id="clearNext"></p>
    <div class="btns" style="margin-top:22px">
      <button class="btn" id="btnNext">次の層へ<small>Enter</small></button>
      <button class="btn sub" id="btnClearMap">マップへ戻る<small>Esc</small></button>
    </div>
  </div>
</section>

<section id="ending" class="screen hidden">
  <div class="line" id="end1">深度 20,000 m</div>
  <div class="line huge" id="end2">奈落の底</div>
  <div class="line" id="end3" style="font-size:18px;letter-spacing:.3em">光の降りつもる場所に、たどり着いた。</div>
  <div class="btns" id="endBtns" style="margin-top:30px">
    <button class="btn" id="btnEndMap">マップへ戻る</button>
    <button class="btn sub" id="btnEndTitle">タイトルへ</button>
  </div>
</section>

<div id="flash"></div>
<div id="fade"></div>

   ===================================================================== */

const TAU = Math.PI * 2;

   ===================================================================== */
const SAVE_KEY = 'naraku.save.v1';
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && Array.isArray(s.cleared) && Array.isArray(s.best)) return s; } catch (e) { }

const SAVE = loadSave();

const unlocked = i => DEBUG.unlock || i === 0 || !!SAVE.cleared[i - 1];
const allCleared = () => SAVE.cleared.every(Boolean);

/* =====================================================================
   3. 音（Web Audio でプログラム合成）
   ===================================================================== */
let ctx = null, master, muffle, reverb, sfxBus, noiseBuf;
function initAudio() {
  if (ctx) { if (ctx.state !== 'running') ctx.resume(); return; }
  ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.25;

  master.connect(comp); comp.connect(ctx.destination);
  muffle = ctx.createBiquadFilter(); muffle.type = 'lowpass'; muffle.frequency.value = 20000; muffle.Q.value = 0.6;

  reverb = ctx.createConvolver(); reverb.buffer = makeIR(3.6);
  const rv = ctx.createGain(); rv.gain.value = 0.8; reverb.connect(rv); rv.connect(muffle);

  noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function makeIR(sec) { // ノイズから作ったインパルス応答
  const len = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) { const k = i / len; d[i] = (Math.random() * 2 - 1) * Math.pow(1 - k, 3.2) * (i < 60 ? i / 60 : 1); } }
  return b;
}
const lat = () => ctx ? (ctx.outputLatency || ctx.baseLatency || 0) : 0;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function osc(type, f, t) { const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); return o; }
function gain(v) { const g = ctx.createGain(); g.gain.value = v; return g; }
function noise(t, dur) { const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.start(t, Math.random() * 1.2); s.stop(t + dur); return s; }
function filt(type, f, q = 1) { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; }
function out(B, node, send) { node.connect(B.dry); if (send > 0) { const s = gain(send); node.connect(s); s.connect(B.rev); } }
function adsr(g, t, a, peak, hold, rel) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.setValueAtTime(peak, t + a + hold); g.gain.exponentialRampToValueAtTime(0.0001, t + a + hold + rel); return t + a + hold + rel; }

const INST = {
  // チェレスタ：サイン波を FM 変調（変調比 3.5）＋速い減衰
  celesta(B, t, f, d, v) {
    const c = osc('sine', f, t), m = osc('sine', f * 3.5, t), mg = gain(0), g = gain(0);
    mg.gain.setValueAtTime(f * (0.4 + 1.3 * v), t); mg.gain.exponentialRampToValueAtTime(f * 0.03 + 1, t + 0.35);

   10. 演出（斬撃の軌跡・衝撃波・光の円・フラッシュ）

const FX = { items: [], later: [] };
function arcMesh(r0, r1, th0, len, color, op = 1) {

function fxAdd(obj, life, upd) { FX.items.push({ obj, life, max: life, upd }); }

const GOLD = new THREE.Color(3.2, 2.2, 0.6), WHITE = new THREE.Color(3, 3, 2.6);

}

  FX.items.push(it); return it;
}
function circleDone() { // 一周すると光の円が完成する
  const m = arcMesh(RING_R - 0.12, RING_R + 0.12, 0, TAU, WHITE, 1);
  fxAdd(m, 0.9, (o, k) => { o.material.opacity = k * 0.8; o.scale.setScalar(1 + (1 - k) * 0.35); });
  for (let i = 0; i < 80; i++) { const a = i / 80 * TAU; _p.set(Math.cos(a) * RING_R, Math.sin(a) * RING_R, 0); _v.set(Math.cos(a) * 2, Math.sin(a) * 2, (Math.random() - 0.5) * 2); sparks.emit(_p, _v, 0.8, 0.16, GOLD, 1.5); }

}
function shockwave(ang) { // 光の斬撃が衝撃波として飛ぶ

function flash(v) { const f = $('flash'); f.style.transition = 'none'; f.style.opacity = v; requestAnimationFrame(() => { f.style.transition = 'opacity .7s ease-out'; f.style.opacity = 0; }); }
function updateFX(dt) {
  for (let i = FX.later.length - 1; i >= 0; i--) { const l = FX.later[i]; l.t -= dt; if (l.t <= 0 && dt > 0) { FX.later.splice(i, 1); l.fn(); } }
  for (let i = FX.items.length - 1; i >= 0; i--) {

    if (it.life <= 0) { scene.remove(it.obj); it.obj.geometry.dispose(); it.obj.material.dispose(); FX.items.splice(i, 1); }

}
function clearFX() { for (const it of FX.items) { scene.remove(it.obj); it.obj.geometry.dispose(); it.obj.material.dispose(); } FX.items = []; FX.later = []; }

const G = { state: 'title', si: 0, song: null, notes: [], spawnI: 0, judgeI: 0, live: [], hitstop: 0, vt: 0, chain: null, depth: 0, shake: 0, speed: 18, speedK: 1, noteSpeed: 30, lead: 2.8, sel: 0, st: 0, clearAt: 0, lastSec: '', timers: [] };

function removeNote(n) { if (n.obj) { scene.remove(n.obj); n.obj = null; } }

function startStage(si) {

  const seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;   // 毎回シードを変える
  const song = G.song = buildSong(si, seed);
  G.notes = song.notes.map(n => ({ ...n, judged: false, obj: null }));

  $('fade').style.transition = 'none'; $('fade').style.opacity = 0;
  $('hudNo').textContent = `深界${S.kan}層`; $('hudName').textContent = S.name;
  $('mubou').textContent = '無傷'; $('mubou').classList.remove('hit');

  show('hud');

function buildProgress(song) {

    const d = document.createElement('div'); d.style.flex = String(sec.bars); d.style.background = SEC_COLOR[sec.type]; d.style.color = SEC_COLOR[sec.type];
    if (sec.type === 'K') d.style.flex = '0 0 6px';

}
function updateHUD(st) {

  const sec = s.sections.find(x => b >= x.start && b < x.start + x.bars) || s.sections[0];
  const label = SEC_NAME[sec.type] + (sec.set >= 0 && STAGES[G.si].sets > 1 ? `　${sec.set + 1}／${STAGES[G.si].sets}` : '');

function spawnNote(n) {

  scene.add(n.obj); G.live.push(n);

}
function placeNote(n, z) {

  else { const r = z < 0 ? laneRadius(z) : RING_R, a = LANE_ANG[n.dir]; o.position.set(Math.cos(a) * r, Math.sin(a) * r, z); }
}

function curSongTime() { return songTime(); }

function judge(dir) {

  const st = curSongTime();
  if (st < G.song.introEnd - 0.3) return;               // 前奏中は数えない
  let cand = null;
  for (let i = G.judgeI; i < G.notes.length; i++) {
    const n = G.notes[i]; if (n.judged) continue;
    if (n.t - st > WIN) break;
    if (Math.abs(n.t - st) <= WIN) { cand = n; break; }
  }
  if (!cand) {
    const nx = G.notes.slice(G.judgeI).find(n => !n.judged);

    box.innerHTML = `<div class="kan">深界極点</div><h3>奈落の底</h3><div class="range">20,000 m 〜</div><p class="note" style="margin:16px 0">七つの層を抜けた者だけがたどり着く場所。</p><div class="btns"><button class="btn" id="btnGo">もう一度見る</button></div>`;
  } else {
    const S = STAGES[i], ok = unlocked(i), done = SAVE.cleared[i];
    box.innerHTML = `<div class="kan">深界${S.kan}層</div><h3>${S.name}</h3><div class="range">${fmt(S.from)} 〜 ${fmt(S.to)} m</div>
      <dl><dt>景色</dt><dd>${S.scene}</dd><dt>敵</dt><dd>${S.enemyName}</dd><dt>障害物</dt><dd>${S.obsName}</dd>
      <dt>曲</dt><dd>${S.bpm} BPM ・ ${S.inst}</dd><dt>長さ</dt><dd>約${Math.floor(S.len / 60)}分${S.len % 60 ? '半' : ''}</dd></dl>
      <div class="status" style="color:${done ? 'var(--gold2)' : ok ? 'var(--txt)' : 'var(--dim)'}">${done ? '✦ 踏破' : ok ? '未踏破' : '封印（前の層を踏破すると開く）'}　<span style="font-weight:500;color:var(--dim);letter-spacing:0">最高到達 ${fmt(SAVE.best[i])} m</span></div>
      <div class="btns">${ok ? '<button class="btn" id="btnGo">潜る<small>Enter</small></button>' : ''}<button class="btn sub" id="btnTitle">タイトル<small>Esc</small></button></div>`;
  }
  $('btnGo')?.addEventListener('click', enterSelected);
  $('btnTitle')?.addEventListener('click', showTitle);
}
function selectLayer(i) { G.sel = i; SFX.select(); applyTheme(i === 7 ? 7 : i); buildMap(); }
function enterSelected() { if (G.sel === 7) { if (allCleared()) startEnding(); return; } if (unlocked(G.sel)) startStage(G.sel); }
function showMap(sel) {
  clearTimers(); stopSong(0.4); clearNotes(); clearFX(); P.reset();
  G.state = 'map';
  let s = sel ?? G.sel; if (s !== 7 && !unlocked(s)) s = 0; G.sel = s;
  applyTheme(s === 7 ? 7 : s);
  $('fade').style.transition = 'none'; $('fade').style.opacity = 0; $('fade').style.background = '#000';
  buildMap(); show('map');
}
function showTitle() { clearTimers(); stopSong(0.4); clearNotes(); P.reset(); G.state = 'title'; applyTheme(0); show('title'); }

/* ---------- 奈落の底（エンディング） ---------- */
function startEnding() {
  initAudio(); clearTimers(); stopSong(0.2); clearNotes(); clearFX(); P.reset();
  G.state = 'ending'; G.sel = 7;
  applyTheme(7); G.speedK = 1;
  const song = buildEndingSong(Date.now() >>> 0);
  playSong(song, 0);
  show('ending');
  for (const id of ['end1', 'end2', 'end3']) $(id).classList.remove('show');
  $('endBtns').classList.remove('show');
  later(2500, () => $('end1').classList.add('show'));
  later(6500, () => $('end2').classList.add('show'));
  later(12000, () => $('end3').classList.add('show'));
  later(18000, () => { $('endBtns').classList.add('show'); $('btnEndMap').focus(); });
}

/* =====================================================================
   13. 入力
   ===================================================================== */
const KEYDIR = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3 };
addEventListener('keydown', e => {
  if (e.key in KEYDIR) e.preventDefault();
  if (e.repeat) return;
  switch (G.state) {
    case 'title': initAudio(); SFX.select(); showMap(); return;
    case 'play':
      if (e.key in KEYDIR) judge(KEYDIR[e.key]);
      else if (e.key === 'Escape') showMap(G.si);
      return;
    case 'map': {
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        const d = e.key === 'ArrowUp' ? -1 : 1, max = allCleared() ? 7 : STAGES.length - 1;
        let i = G.sel + d; while (i >= 0 && i <= max && i < 7 && !unlocked(i)) i += d;
        if (i >= 0 && i <= max) selectLayer(i);
      } else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enterSelected(); }
      else if (e.key === 'Escape') showTitle();
      return;
    }
    case 'over':
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startStage(G.si); } else if (e.key === 'Escape') showMap(G.si);
      return;
    case 'clear':
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); nextFromClear(); } else if (e.key === 'Escape') showMap(Math.min(G.si + 1, 6));
      return;
    case 'ending':
      if ($('endBtns').classList.contains('show') && e.key === 'Escape') showMap(7);
      return;
  }
}, { passive: false });
function nextFromClear() { if (G.si + 1 < STAGES.length) startStage(G.si + 1); else startEnding(); }
$('title').addEventListener('click', () => { initAudio(); SFX.select(); showMap(); });
$('btnRetry').onclick = () => startStage(G.si);
$('btnOverMap').onclick = () => showMap(G.si);
$('btnNext').onclick = nextFromClear;
$('btnClearMap').onclick = () => showMap(Math.min(G.si + 1, 6));
$('btnEndMap').onclick = () => showMap(7);
$('btnEndTitle').onclick = showTitle;

/* =====================================================================
   14. メインループ
   ===================================================================== */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); composer.setSize(w, h); bloom.setSize(w, h);
  camera.aspect = w / h; camera.fov = w / h < 1 ? 78 : 62; camera.updateProjectionMatrix();
  const sc = h * renderer.getPixelRatio() / (2 * Math.tan(camera.fov * Math.PI / 360));
  for (const m of pointMats) m.uniforms.scale.value = sc;
}
addEventListener('resize', resize);
let last = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, (now - last) / 1000); last = now;
  let vdt = rdt;
  if (G.hitstop > 0) { G.hitstop -= rdt; vdt = 0; }   // ヒットストップ：演出の時間だけ止める（ノーツは曲の時刻に合わせたまま）
  G.vt += vdt;
  for (const m of pointMats) m.uniforms.scale.value ||= 400;
  if (G.state === 'play') updatePlay();
  // 落下の速さ
  const target = G.state === 'dying' || G.state === 'over' ? 0.25 : G.state === 'clearing' ? 3.2 : G.state === 'ending' ? 0.45 : G.state === 'play' ? 1 : 0.6;
  G.speedK = lerp(G.speedK, target, 1 - Math.exp(-rdt * (G.state === 'ending' ? 0.25 : 2)));
  updateWorld(vdt, G.vt, (TH ? TH.speed : 18) * G.speedK);
  P.update(vdt, G.vt);
  for (const n of G.live) if (n.obj && !n.frozen && vdt > 0) {
    n.obj.userData.tick?.(G.vt * (n.show ? 1.2 : 1));
    const sp = n.obj.userData.spin; if (sp) { n.obj.rotation.x += sp.x * vdt; n.obj.rotation.y += sp.y * vdt; }
    if (n.type === 'large') n.obj.rotation.z = LANE_ANG[n.dir] + Math.sin(G.vt * 2 + n.t) * 0.04;
  }
  sparks.update(vdt); updateFX(vdt);
  for (const L of laneMk) {
    L.press = Math.max(0, L.press - rdt * 4);
    const w = G.state === 'play' ? L.warn : 0;
    L.glow.material.opacity = Math.max(L.press, w * 0.9);
    if (w > 0.01) { L.glow.material.color.copy(L.warnC).multiplyScalar(0.5); L.g.scale.setScalar(1 + w * 0.5); }
    else { L.glow.material.color.copy(hdr(0xffe0a0, 1)); L.g.scale.setScalar(1 + L.press * 0.4); }
  }
  ring.visible = P.root.visible && (G.state === 'play' || G.state === 'dying' || G.state === 'clearing');
  // 画面の揺れ
  G.shake = Math.max(0, G.shake - rdt * 1.6);
  const s = G.shake * G.shake;
  camera.position.set(CAM_POS.x + (Math.random() - 0.5) * s, CAM_POS.y + (Math.random() - 0.5) * s, CAM_POS.z);
  camera.lookAt(CAM_LOOK);
  bloom.strength = 0.8 + P.st.flare * 1.6;
  composer.render();
  requestAnimationFrame(frame);
}
applyTheme(0); resize(); show('title');
requestAnimationFrame(frame);
window.__naraku = { G, STAGES, buildSong, startStage, showMap, startEnding, SAVE, applyTheme, makeNoteObj, scene, P, THREE, show };
</script>
